# Minimal production-shaped run: one app container, one persistent volume.
#
#   cp .env.example .env   # then set JWT_SECRET and PUBLIC_BASE_URL
#   docker compose up -d --build
#   docker compose exec app npm run seed     # optional demo data

services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Required in production — the server refuses to start with the default.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Must be an address a guest's phone can actually reach; it is baked
      # into every printed QR code.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DATABASE_FILE: /data/menu.db
      UPLOAD_DIR: /data/uploads
      # Set when a TLS-terminating proxy sits in front of the container.
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      # Leave unset to use the built-in payment simulator.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    volumes:
      - menu-data:/data

volumes:
  menu-data:
