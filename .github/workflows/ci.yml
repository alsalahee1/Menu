name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is what ships.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 falls back to compiling from source when no prebuild
      # matches, so the toolchain has to be present.
      - name: Install dependencies
        run: npm ci

      - name: Run the API suite
        run: npm test

      - name: Seed a fresh database
        run: npm run seed

      - name: Boot the server and check it answers
        run: |
          node server/index.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "server is up"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "server never became healthy"
              exit 1
            fi
            sleep 1
          done

          # The guest entry point and the public menu are the two paths that
          # must never break — a QR code leads straight to them.
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          curl -fsS http://127.0.0.1:3000/api/public/restaurants | grep -q 'zaytoun-grill'
          echo "smoke checks passed"

  docker:
    name: Container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t menu-qr:ci .

      # Proves the image actually runs, not just that it builds: the native
      # better-sqlite3 step and the non-root file permissions both fail here
      # rather than in production if they are wrong.
      - name: Run the container and check its health
        run: |
          docker run -d --name menu-ci \
            -p 3000:3000 \
            -e JWT_SECRET=ci-only-secret-not-used-anywhere-else \
            -e PUBLIC_BASE_URL=http://127.0.0.1:3000 \
            menu-qr:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "container is healthy"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "container never became healthy — logs follow:"
              docker logs menu-ci
              exit 1
            fi
            sleep 2
          done

          # A fresh volume starts empty; seeding must work inside the image.
          docker exec menu-ci npm run seed
          curl -fsS http://127.0.0.1:3000/api/public/restaurants | grep -q 'zaytoun-grill'
          echo "container smoke checks passed"

      - name: Container logs
        if: always()
        run: docker logs menu-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f menu-ci || true
