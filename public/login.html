<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff sign in — Menu</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div style="width:100%;max-width:400px">
      <div class="center mb-24">
        <a href="/" class="row gap-8" style="justify-content:center;color:inherit;font-weight:700;font-size:1.2rem">
          <span style="width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-contrast);display:grid;place-items:center">🍽</span>
          <span>Menu</span>
        </a>
        <p class="muted small mt-8">Sign in to the restaurant dashboard</p>
      </div>

      <div class="card card-pad">
        <form id="login-form">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="username" autofocus>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" required autocomplete="current-password">
          </div>
          <div id="error" class="badge badge-danger mb-16" hidden style="display:block;padding:9px 12px"></div>
          <button id="submit" class="btn btn-primary btn-block btn-lg" type="submit">Sign in</button>
        </form>

        <div class="divider-text">Demo accounts</div>
        <div class="col gap-4" id="demo-accounts"></div>
      </div>

      <p class="center small muted mt-16">
        <a href="/">← Back to the guest site</a>
      </p>
    </div>
  </main>

  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/pages/login.js"></script>
</body>
</html>
